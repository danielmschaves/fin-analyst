name: poc-pipeline

# Execução real da PoC da plataforma de dados (docs/poc-plataforma-dados.md):
# fontes reais → lake → core → dbt → publish, com as falhas provocadas (drills) e a medição.
# Sem os secrets de Neon/R2, usa Postgres e S3 (moto) efêmeros no próprio runner.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Anos do backfill de COTAHIST (separados por espaço)'
        default: '2025 2026'
      cvm_years:
        description: 'Anos de DFP/ITR da CVM'
        default: '2024 2025 2026'
      drills:
        description: 'Rodar as falhas provocadas (R4, R5, R6, P1)'
        type: boolean
        default: true
  push:
    branches: ['feat/poc-*', 'chore/poc-*']
    paths: ['services/**', 'poc/**', '.github/workflows/poc-pipeline.yml']
  schedule:
    # dias úteis, 22h UTC (19h em Brasília), depois da publicação do COTAHIST diário
    - cron: '0 22 * * 1-5'

concurrency:
  group: poc-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      YEARS: ${{ inputs.years || '2025 2026' }}
      CVM_YEARS: ${{ inputs.cvm_years || '2024 2025 2026' }}
      DRILLS: ${{ github.event_name != 'workflow_dispatch' || inputs.drills }}
      DATABASE_URL: ${{ secrets.POC_DATABASE_URL || 'postgresql://postgres:pg@localhost:5432/postgres' }}
      S3_ENDPOINT: ${{ secrets.R2_ENDPOINT || 'http://localhost:9000' }}
      S3_BUCKET: ${{ secrets.R2_BUCKET || 'fin-analyst-lake' }}
      S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || 'minio' }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || 'minio-local' }}
      S3_REGION: ${{ secrets.R2_ACCESS_KEY_ID && 'auto' || 'us-east-1' }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      REPORT: poc-report
      DBT_PROJECT_DIR: ${{ github.workspace }}/services/transform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/ingest/pyproject.toml
            services/transform/pyproject.toml

      - name: Instalar ingest e transform
        run: pip install ./services/ingest -e ./services/transform

      - name: Lake efêmero (S3 do moto) quando não há R2
        if: env.S3_ENDPOINT == 'http://localhost:9000'
        run: |
          pip install 'moto[server]>=5'
          nohup moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/ > /dev/null && break; sleep 1; done
          python -c "import boto3, os; boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT'], aws_access_key_id='minio', aws_secret_access_key='minio-local', region_name='us-east-1').create_bucket(Bucket=os.environ['S3_BUCKET'])"
          echo "- Infra: Postgres e S3 (moto) efêmeros no runner, sem secrets de Neon/R2" >> "$GITHUB_STEP_SUMMARY"

      - name: Migrations (2× para provar idempotência)
        run: |
          ingest db migrate
          ingest db migrate
          mkdir -p "$REPORT"

      - name: R5 · backfill interrompido de propósito
        if: env.DRILLS == 'true'
        continue-on-error: true
        run: |
          first=$(echo $YEARS | awk '{print $1}')
          set +e
          timeout -s INT 25 ingest run cotahist --year "$first"
          echo "exit=$?" | tee "$REPORT/r5-interrupt.txt"
          psql "$DATABASE_URL" -Atc "SELECT unit, status FROM ingest.units WHERE source='cotahist'" | tee -a "$REPORT/r5-interrupt.txt"

      - name: Backfill COTAHIST (retoma o que ficou pela metade)
        continue-on-error: true
        run: |
          args=""; for y in $YEARS; do args="$args --year $y"; done
          ingest run cotahist $args 2>&1 | tee "$REPORT/backfill.txt"
          # segunda execução: tudo concluído é pulado, sem chamar a fonte
          ingest run cotahist $args 2>&1 | tee "$REPORT/backfill-resume.txt"

      - name: R6 · reprocessar um ano fechado dá o mesmo checksum
        if: env.DRILLS == 'true'
        continue-on-error: true
        run: |
          first=$(echo $YEARS | awk '{print $1}')
          before=$(python poc/measure.py checksum core.prices_daily_y$first)
          psql "$DATABASE_URL" -c "DELETE FROM ingest.http_cache WHERE key LIKE '%COTAHIST_A$first%'"
          ingest run cotahist --year "$first" --force
          after=$(python poc/measure.py checksum core.prices_daily_y$first)
          echo "antes=$before" | tee "$REPORT/r6.txt"
          echo "depois=$after" | tee -a "$REPORT/r6.txt"
          [ "$before" = "$after" ] && echo "R6 OK: mesmas linhas e checksum" | tee -a "$REPORT/r6.txt" "$GITHUB_STEP_SUMMARY" \
            || { echo "R6 FALHOU" | tee -a "$REPORT/r6.txt" "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: COTAHIST diário (D-1)
        continue-on-error: true
        run: ingest run cotahist --daily 2>&1 | tee "$REPORT/daily.txt"

      - name: CVM DFP/ITR (e de novo, condicional → 304)
        continue-on-error: true
        run: |
          args=""; for y in $CVM_YEARS; do args="$args --year $y"; done
          ingest run cvm $args 2>&1 | tee "$REPORT/cvm.txt"
          ingest run cvm $args --force 2>&1 | tee "$REPORT/cvm-conditional.txt"

      - name: BCB SGS (incremental, 2×)
        continue-on-error: true
        run: |
          ingest run bcb_sgs 2>&1 | tee "$REPORT/bcb.txt"
          ingest run bcb_sgs 2>&1 | tee "$REPORT/bcb-incremental.txt"

      - name: brapi (pulado sem token)
        continue-on-error: true
        run: ingest run brapi 2>&1 | tee "$REPORT/brapi.txt"

      - name: R4 · fonte fora do ar → degraded, o resto segue
        if: env.DRILLS == 'true'
        continue-on-error: true
        run: |
          set +e
          ingest run bcb_sgs --base-url https://fonte-inexistente.invalid/ 2>&1 | tee "$REPORT/r4.txt"
          echo "exit=${PIPESTATUS[0]}" | tee -a "$REPORT/r4.txt"
          # limpa a DLQ do drill para não contaminar a próxima execução real
          psql "$DATABASE_URL" -c "DELETE FROM ingest.dlq WHERE source='bcb_sgs'"

      - name: dbt source freshness
        continue-on-error: true
        working-directory: services/transform
        run: |
          eval "$(python -c 'from fin_transform.publish import pg_env; [print(f"export {k}={v!r}") for k, v in pg_env().items()]')"
          dbt source freshness --project-dir . --profiles-dir . 2>&1 | tee "../../$REPORT/freshness.txt"

      - name: Publish (dbt build em marts_next → swap)
        id: publish
        run: publish run 2>&1 | tee "$REPORT/publish.txt"; exit ${PIPESTATUS[0]}

      - name: P1 · teste sentinela falhando não troca nada
        if: env.DRILLS == 'true'
        continue-on-error: true
        run: |
          before=$(python poc/measure.py marts-count)
          set +e
          publish run --vars '{poc_sentinel: true}' > "$REPORT/p1.txt" 2>&1
          code=$?
          after=$(python poc/measure.py marts-count)
          echo "exit=$code antes=$before depois=$after" | tee -a "$REPORT/p1.txt"
          if [ "$code" -ne 0 ] && [ "$before" = "$after" ]; then
            echo "P1 OK: publish falhou e marts ficou intacto" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "P1 FALHOU" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      - name: Medição
        if: always()
        run: python poc/measure.py report --out "$REPORT"

      - name: Relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-report
          path: poc-report
          retention-days: 30
