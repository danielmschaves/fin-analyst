# Plataforma de dados local: Postgres (core/marts), MinIO (lake S3-compatível, no lugar do R2) e ingest.
#   docker compose -f infra/docker-compose.yml up -d postgres minio minio-init
#   docker compose -f infra/docker-compose.yml run --rm ingest db migrate
#   docker compose -f infra/docker-compose.yml run --rm ingest run bcb_sgs
# Credenciais abaixo são só do ambiente local descartável.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: fin
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local
    ports: ['9000:9000', '9001:9001']

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minio minio-local; do sleep 1; done;
             mc mb --ignore-existing local/fin-analyst-lake"

  ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:pg@postgres:5432/fin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: fin-analyst-lake
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio-local
      S3_REGION: us-east-1
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
