# Plataforma de dados local: Postgres (core/marts), S3 local do moto (no lugar do R2) e ingest.
#   docker compose -f infra/docker-compose.yml up -d postgres s3
#   docker compose -f infra/docker-compose.yml run --rm ingest db migrate
#   docker compose -f infra/docker-compose.yml run --rm ingest run bcb_sgs
# Credenciais abaixo são só do ambiente local descartável.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: fin
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  # S3 compatível em memória (a imagem pública do MinIO deixou de ser publicada no Docker Hub).
  # Crie o bucket uma vez:
  #   docker compose -f infra/docker-compose.yml run --rm --entrypoint python ingest -c \
  #     "import boto3; boto3.client('s3', endpoint_url='http://s3:5000', aws_access_key_id='local', aws_secret_access_key='local', region_name='us-east-1').create_bucket(Bucket='fin-analyst-lake')"
  s3:
    image: motoserver/moto:latest
    ports: ['5000:5000']

  ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:pg@postgres:5432/fin
      S3_ENDPOINT: http://s3:5000
      S3_BUCKET: fin-analyst-lake
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
      S3_REGION: us-east-1
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
