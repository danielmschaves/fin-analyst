[project]
name = "fin-ingest"
version = "0.1.0"
description = "Ingestão do fin-analyst: fontes → R2 (bronze/silver) → Postgres core. Resiliente e idempotente."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "polars>=1.20",
  "pyarrow>=18",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "respx>=0.22",
  "moto[s3]>=5",
  "ruff>=0.8",
]

[project.scripts]
ingest = "fin_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fin_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: precisa de Postgres (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: o formatter cuida do código; docstrings e textos em pt-BR podem passar um pouco.
# B008: typer.Option nos defaults é o padrão do typer.
ignore = ["E501", "B008"]
