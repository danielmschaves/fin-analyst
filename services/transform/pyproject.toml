[project]
name = "fin-transform"
version = "0.1.0"
description = "dbt do fin-analyst (core → marts_next) e publicação com swap atômico de schema."
requires-python = ">=3.12"
dependencies = [
  "dbt-core>=1.9,<1.11",
  "dbt-postgres>=1.9,<1.11",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
publish = "fin_transform.publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fin_transform"]

[tool.pytest.ini_options]
testpaths = ["pytests"]  # tests/ é dos testes singulares do dbt
markers = ["db: precisa de Postgres (TEST_DATABASE_URL)", "dbt: roda o dbt de verdade"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["target", "dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
